<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI面接練習</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <div class="interview-container">

        <!-- 左側：カメラエリア -->
        <div class="camera-area">

            <h2 class="camera-title">
                面接カメラ
            </h2>

            <video
                id="camera"
                autoplay
                playsinline
            ></video>

            <div class="timer-box">
                経過時間：
                <span id="timer">0</span>秒
            </div>

            <div class="camera-note">
                カメラを見ながら、落ち着いて回答しましょう。
            </div>

        </div>


        <!-- 右側：チャットと入力 -->
        <div class="right-area">

            <!-- チャットエリア -->
            <div
                id="chat"
                class="chat-box"
            ></div>


            <!-- 入力エリア -->
            <div class="input-area">

                <div class="voice-buttons">

                    <button
                        type="button"
                        onclick="startSpeech()"
                    >
                        🎤 話す
                    </button>

                    <button
                        type="button"
                        class="stop-button"
                        onclick="stopSpeech()"
                    >
                        ⏹ 停止
                    </button>

                </div>


                <textarea
                    id="answer"
                    placeholder="回答を入力してください"
                ></textarea>


                <button
                    type="button"
                    class="send-button"
                    onclick="submitAnswer()"
                >
                    回答送信
                </button>


                <p id="status"></p>

            </div>

        </div>

    </div>


    <script>
        let questionText = "";
        let questionHistory = [];

        let startTime = null;
        let timerRunning = false;

        let recognition = null;
        let speechBaseText = "";

        let isLoadingQuestion = false;
        let isSubmitting = false;

        const MAX_RETRY_COUNT = 3;
        const QUESTION_TIMEOUT_MS = 15000;
        const ANALYZE_TIMEOUT_MS = 30000;
        const MAX_HISTORY_COUNT = 12;

        const type =
            localStorage.getItem("type") || "";

        const personality =
            localStorage.getItem("personality") || "";


        // =====================
        // 共通処理
        // =====================

        function sleep(ms) {
            return new Promise(
                resolve => setTimeout(resolve, ms)
            );
        }


        async function fetchWithTimeout(
            url,
            options = {},
            timeoutMs = 15000
        ) {
            const controller =
                new AbortController();

            const timeoutId =
                setTimeout(
                    () => controller.abort(),
                    timeoutMs
                );

            try {
                return await fetch(
                    url,
                    {
                        ...options,
                        signal: controller.signal
                    }
                );

            } finally {
                clearTimeout(timeoutId);
            }
        }


        function getErrorMessage(error) {
            if (error && error.name === "AbortError") {
                return "通信がタイムアウトしました。";
            }

            return error?.message ||
                "通信エラーが発生しました。";
        }


        // =====================
        // カメラ
        // =====================

        navigator.mediaDevices
            .getUserMedia({
                video: true,
                audio: false
            })

            .then(stream => {
                const camera =
                    document.getElementById("camera");

                camera.srcObject = stream;
            })

            .catch(error => {
                console.error(
                    "カメラ取得エラー:",
                    error
                );

                document
                    .getElementById("status")
                    .innerText =
                    "カメラを使用できませんでした。ブラウザの許可を確認してください。";
            });


        // =====================
        // チャット追加
        // =====================

        function addMessage(role, text) {
            const chat =
                document.getElementById("chat");

            const div =
                document.createElement("div");

            div.className =
                "message " + role;

            if (role === "assistant") {
                div.innerHTML = `
                    <div class="message-name">
                        👨 面接官
                    </div>

                    <div class="message-text">
                        ${text}
                    </div>
                `;

            } else {
                div.innerHTML = `
                    <div class="message-name">
                        🙋 あなた
                    </div>

                    <div class="message-text">
                        ${text}
                    </div>
                `;
            }

            chat.appendChild(div);

            chat.scrollTop =
                chat.scrollHeight;
        }


        // =====================
        // 質問再取得ボタン
        // =====================

        function showQuestionRetryButton() {
            const status =
                document.getElementById("status");

            status.innerHTML = `
                <button
                    type="button"
                    class="retry-button"
                    onclick="retryQuestion()"
                >
                    🔄 質問を再取得
                </button>
            `;
        }


        function retryQuestion() {
            document
                .getElementById("status")
                .innerHTML = "";

            loadQuestion();
        }


        // =====================
        // 評価後の操作ボタン
        // =====================

        function showNextActionButtons() {
            const status =
                document.getElementById("status");

            status.innerHTML = `
                <div class="next-action-buttons">

                    <button
                        type="button"
                        class="retry-answer-button"
                        onclick="retryAnswer()"
                    >
                        🔁 同じ質問にもう一度回答
                    </button>

                    <button
                        type="button"
                        class="next-question-button"
                        onclick="nextQuestion()"
                    >
                        ➡ 次の質問
                    </button>

                </div>
            `;
        }


        function retryAnswer() {
            const answerArea =
                document.getElementById("answer");

            isSubmitting = false;
            answerArea.value = "";

            document
                .getElementById("timer")
                .innerText = "0";

            startTime = Date.now();
            timerRunning = true;

            document
                .getElementById("status")
                .innerText =
                "同じ質問にもう一度回答してください。";

            addMessage(
                "assistant",
                "同じ質問でもう一度回答してみましょう。"
            );

            answerArea.focus();
        }


        function nextQuestion() {
            isSubmitting = false;

            document
                .getElementById("status")
                .innerHTML = "";

            loadQuestion();
        }


        // =====================
        // 質問取得
        // =====================

        async function loadQuestion() {
            if (isLoadingQuestion) {
                return;
            }

            isLoadingQuestion = true;
            timerRunning = false;

            const status =
                document.getElementById("status");

            const answerArea =
                document.getElementById("answer");

            answerArea.value = "";

            document
                .getElementById("timer")
                .innerText = "0";

            try {
                for (
                    let attempt = 0;
                    attempt <= MAX_RETRY_COUNT;
                    attempt++
                ) {
                    try {
                        if (attempt === 0) {
                            status.innerText =
                                "質問を取得しています...";
                        } else {
                            status.innerText =
                                `質問を再取得しています（${attempt}/${MAX_RETRY_COUNT}）...`;
                        }

                        const response =
                            await fetchWithTimeout(
                                "/get_question",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },
                                    body: JSON.stringify({
                                        type: type,
                                        personality: personality,
                                        history: questionHistory
                                    })
                                },
                                QUESTION_TIMEOUT_MS
                            );

                        if (!response.ok) {
                            const errorData =
                                await response
                                    .json()
                                    .catch(() => ({}));

                            throw new Error(
                                errorData.error ||
                                `質問取得エラー：${response.status}`
                            );
                        }

                        const data =
                            await response.json();

                        if (!data.question) {
                            throw new Error(
                                "質問内容が空です。"
                            );
                        }

                        const newQuestion =
                            data.question.trim();

                        // 完全一致の重複はクライアント側でも拒否
                        if (
                            questionHistory.includes(
                                newQuestion
                            )
                        ) {
                            throw new Error(
                                "同じ質問が返されたため再取得します。"
                            );
                        }

                        questionText =
                            newQuestion;

                        questionHistory.push(
                            newQuestion
                        );

                        if (
                            questionHistory.length >
                            MAX_HISTORY_COUNT
                        ) {
                            questionHistory =
                                questionHistory.slice(
                                    -MAX_HISTORY_COUNT
                                );
                        }

                        addMessage(
                            "assistant",
                            newQuestion
                        );

                        startTime =
                            Date.now();

                        timerRunning =
                            true;

                        status.innerText =
                            "回答してください。";

                        answerArea.focus();

                        return;

                    } catch (error) {
                        console.error(
                            `質問取得エラー attempt=${attempt + 1}:`,
                            error
                        );

                        if (
                            attempt >=
                            MAX_RETRY_COUNT
                        ) {
                            throw error;
                        }

                        status.innerText =
                            `${getErrorMessage(error)} 2秒後に再試行します。`;

                        await sleep(2000);
                    }
                }

            } catch (error) {
                console.error(
                    "質問取得に最終的に失敗:",
                    error
                );

                addMessage(
                    "assistant",
                    `
                    質問を取得できませんでした。<br>
                    通信状態を確認して、再取得してください。
                    `
                );

                status.innerText =
                    getErrorMessage(error);

                showQuestionRetryButton();

            } finally {
                isLoadingQuestion = false;
            }
        }


        // =====================
        // タイマー
        // =====================

        setInterval(() => {
            if (
                !timerRunning ||
                startTime === null
            ) {
                return;
            }

            const sec =
                Math.floor(
                    (Date.now() - startTime)
                    / 1000
                );

            document
                .getElementById("timer")
                .innerText = sec;

        }, 1000);


        // =====================
        // 音声認識
        // =====================

        function startSpeech() {
            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert(
                    "このブラウザは音声認識に対応していません。"
                );
                return;
            }

            if (recognition) {
                document
                    .getElementById("status")
                    .innerText =
                    "すでに音声認識中です。";
                return;
            }

            const answerArea =
                document.getElementById("answer");

            speechBaseText =
                answerArea.value.trim();

            recognition =
                new SpeechRecognition();

            recognition.lang =
                "ja-JP";

            recognition.interimResults =
                true;

            recognition.continuous =
                true;

            recognition.onstart = () => {
                document
                    .getElementById("status")
                    .innerText =
                    "音声を認識しています...";
            };

            recognition.onresult = event => {
                let speechText = "";

                for (
                    let i = 0;
                    i < event.results.length;
                    i++
                ) {
                    speechText +=
                        event.results[i][0]
                            .transcript;
                }

                if (speechBaseText) {
                    answerArea.value =
                        speechBaseText +
                        " " +
                        speechText;
                } else {
                    answerArea.value =
                        speechText;
                }
            };

            recognition.onerror = event => {
                console.error(
                    "音声認識エラー:",
                    event.error
                );

                if (!isSubmitting) {
                    document
                        .getElementById("status")
                        .innerText =
                        "音声認識中にエラーが発生しました。";
                }
            };

            recognition.onend = () => {
                recognition = null;

                // 回答送信中は「音声入力を停止しました」で
                // AI評価中表示を上書きしない
                if (!isSubmitting) {
                    document
                        .getElementById("status")
                        .innerText =
                        "音声入力を停止しました。";
                }
            };

            recognition.start();
        }


        function stopSpeech() {
            if (recognition) {
                recognition.stop();
            }
        }


        // =====================
        // 回答送信
        // =====================

        async function submitAnswer() {
            if (isSubmitting) {
                return;
            }

            const answerArea =
                document.getElementById("answer");

            const answer =
                answerArea.value.trim();

            if (!answer) {
                document
                    .getElementById("status")
                    .innerText =
                    "回答を入力してください。";
                return;
            }

            if (!questionText) {
                document
                    .getElementById("status")
                    .innerText =
                    "質問を取得してから回答してください。";
                return;
            }

            isSubmitting = true;

            if (recognition) {
                recognition.stop();
            }

            timerRunning = false;

            addMessage(
                "user",
                answer
            );

            answerArea.value = "";

            const status =
                document.getElementById("status");

            status.innerText =
                "AIが回答を評価しています...";

            try {
                const response =
                    await fetchWithTimeout(
                        "/analyze",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({
                                question: questionText,
                                answer: answer
                            })
                        },
                        ANALYZE_TIMEOUT_MS
                    );

                if (!response.ok) {
                    const errorData =
                        await response
                            .json()
                            .catch(() => ({}));

                    throw new Error(
                        errorData.error ||
                        `回答分析エラー：${response.status}`
                    );
                }

                const data =
                    await response.json();

                let correctionHtml = "";

                if (
                    data.corrected_answer &&
                    data.corrected_answer.trim() !==
                    answer.trim()
                ) {
                    correctionHtml = `
                        <div class="corrected-answer">
                            <strong>
                                📝 音声認識を補正しました
                            </strong><br>
                            ${data.corrected_answer}
                        </div>
                    `;
                }

                addMessage(
                    "assistant",
                    `
                    <div class="evaluation-title">
                        評価しました。
                    </div>

                    <div class="score">
                        点数：${data.score}点
                    </div>

                    ${correctionHtml}

                    <div class="evaluation-item">
                        <strong>良かった点</strong><br>
                        ${data.good || "特にありません。"}
                    </div>

                    <div class="evaluation-item">
                        <strong>改善点</strong><br>
                        ${data.improve || "特にありません。"}
                    </div>

                    <div class="next-message">
                        次の操作を選んでください。
                    </div>
                    `
                );

                showNextActionButtons();

            } catch (error) {
                console.error(
                    "回答分析エラー:",
                    error
                );

                addMessage(
                    "assistant",
                    `
                    分析中にエラーが発生しました。<br>
                    ${getErrorMessage(error)}
                    `
                );

                status.innerText =
                    "回答分析に失敗しました。もう一度回答を送信してください。";

                isSubmitting = false;

                answerArea.value =
                    answer;

                answerArea.focus();
            }
        }


        // =====================
        // 初回質問
        // =====================

        loadQuestion();

    </script>

</body>

</html>
